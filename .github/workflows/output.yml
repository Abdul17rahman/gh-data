name: Tests, Lints and Deploy

on: push # Runs only on push event for any branche

# Outputs are values that are generated by a job and can be used by another job in the same workflow. Outputs are useful for sharing data between jobs, such as test results, build outputs, or logs.

jobs:
  lints:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependecies
        run: npm ci

      - name: Lint
        run: npm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependecies
        run: npm ci

      - name: Test
        run: npm run test

  build:
    needs: [lints, tests]
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.publish.outputs.script-file }}
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependecies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set output value
        id: publish
        run: find dist/assets/*.js -type f -execdir echo 'script-file={}' >> $GITHUB_OUTPUT ';'

      - name: Upload build output files/artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-files
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build output files
        uses: actions/download-artifact@v6
        with:
          name: dist-files

      - name: Get output value from build
        run: echo "${{ needs.build.outputs.script-file }}""

      - name: Output the downloaded files
        run: ls -la

      - name: Success
        run: echo "Deployed successfully..."
