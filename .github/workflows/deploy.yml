name: Tests, Lints and Deploy

on: push # Runs only on push event for any branche

# Job artifacts are assets generated by a job and can be used by another job in the same workflow. Artifacts are stored in GitHub and can be downloaded after a workflow run is complete. Artifacts are useful for sharing data between jobs, such as test results, build outputs, or logs.

jobs:
  lints:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependecies
        run: npm ci

      - name: Lint
        run: npm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependecies
        run: npm ci

      - name: Test
        run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: [lints, tests]
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependecies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build output files/artifacts
        uses: actions/upload-artifact@v6 # This action uploads outputed files from the workflow to GitHub so that they can be used by another job in the same workflow or downloaded after the workflow run is complete.
        with:
          name: dist-files # name of the artifact
          path: dist
          # path: |
          #   dist
          #   package.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Download build output files
        uses: actions/download-artifact@v6 # This action downloads the outputed files/artifacts from the previous job in the same workflow.
        with:
          name: dist-files # name of the artifact to download
      - name: Output the downloaded files
        run: ls -la

      - name: Success
        run: echo "Deployed successfully..."
